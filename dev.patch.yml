# Local development layer for dsh-select-quote — loaded with `dsh web --patch`.
#
# The loader resolves roster rows by package name, and a checkout is NOT
# installed in the profile's node_modules, so this layer must point at the
# host-half ENTRY FILE by ABSOLUTE PATH. Update the path when the checkout moves
# (and when switching machines — the path below is this machine's). Point at the
# BUILT artifact rather than a source file: `lib/index.js` is plain JS the Node
# loader imports directly, while a `.ts` source would need a transpiler in the
# loader. That is why the steps below run `npm run build` first. This file is
# not shipped in the npm package; the published bundle uses `cordis.patch.yml`
# (package name) instead.
#
#   npm run build
#   dsh web --patch /absolute/path/to/dsh-select-quote/dev.patch.yml
- insert:
    - id: select-quote
      name: 'F:/code/dsh-select-quote/lib/index.js'
